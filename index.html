<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sneakers Spicy | Live Vault & Marketplace</title>
  <meta name="description" content="Descubre calzado exclusivo, sneakers de edición limitada, sportwear y medias con verificación de autenticidad y envío rápido.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            stockx: {
              bg: '#050505',
              surface: '#121214',
              card: '#0D0D0E',
              border: 'rgba(255, 255, 255, 0.1)',
              text: '#FFFFFF',
              muted: '#A1A1AA',
              green: '#00A664',
              pill: '#1A1A1E',
            },
            red: {
              500: 'var(--primary-color, #EF4444)',
              600: 'var(--primary-color, #DC2626)',
              700: 'var(--primary-color, #B91C1C)'
            }
          },
          boxShadow: {
            'spicy-red': '0 0 30px rgba(239, 68, 68, 0.25)',
            'stockx-dark': '0 4px 20px rgba(0, 0, 0, 0.6)',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    body { 
      background-color: #050505; 
      color: #FFFFFF; 
      margin: 0; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
    }
    #root { min-height: 100vh; background-color: #050505; }
    
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0A0A0B; }
    ::-webkit-scrollbar-thumb { background: #27272A; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #EF4444; }

    /* Utilities */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#050505] text-white antialiased selection:bg-red-600 selection:text-white overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
